<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mini‑Mi | Genera tu figura 3D</title>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
  <h1>Mini‑Mi | Genera tu figura 3D desde una foto</h1>

  <!-- Subir foto -->
  <input type="file" id="foto" accept="image/png, image/jpeg">
  <button onclick="procesarFoto()">Generar Mini‑Mi 3D</button>
  <p id="estado"></p>

  <!-- Visor 3D -->
  <model-viewer id="visor" src="" alt="Mini‑Mi 3D"
                auto-rotate camera-controls
                style="width: 100%; height: 400px; background: #eee;">
  </model-viewer>

  <script>
    function procesarFoto() {
      const estado = document.getElementById("estado");
      estado.textContent = "Procesando foto...";
      setTimeout(() => {
        estado.textContent = "¡Modelo 3D generado con éxito!";
        mostrarModelo();
      }, 2000);
    }

    function mostrarModelo() {
      const visor = document.getElementById("visor");
      visor.src = "https://modelviewer.dev/shared-assets/models/Astronaut.glb";
    }
  </script>
</body>
</html>
